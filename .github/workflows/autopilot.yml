name: Autopilot
# Implements ONE human-approved OpenSpec change per run and opens a PR for review.
#
# Off by default. Turn it on with the repo variable AUTOPILOT_ENABLED=true once CI, branch
# protection and CODEOWNERS are in place. Manual runs (workflow_dispatch) always work.
#
# Gate 1 still applies: a change is only eligible if its folder is on the default branch
# (it got there through a reviewed spec PR) AND its tasks.md has the `approved` line a human
# added during that review. The agent never marks its own work as approved.
on:
  schedule:
    - cron: '0 2 * * 1-5' # weekday nights, so a human is around to review the next morning
  workflow_dispatch:
    inputs:
      change:
        description: 'Change folder name to implement (optional; default = next eligible)'
        required: false

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  build-next-spec:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOPILOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(npm run:*),Bash(npx vitest:*),Bash(npx openspec:*),Bash(git:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh issue create:*),Bash(gh issue list:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(npm install:*),Bash(npm i:*)"
          prompt: |
            Implement exactly ONE OpenSpec change. Never batch several changes into one PR.
            Requested change (may be empty): "${{ github.event.inputs.change }}"

            1. Eligible changes are folders in openspec/changes/ (not archive/) whose tasks.md
               contains a line starting with `approved:` written by a human. Skip any with an
               open PR (`gh pr list --search "<change-name>"`), and any whose proposal.md says
               "depends on: X" where X is not yet archived. If a change name was requested,
               use it only if eligible. If nothing is eligible, stop without doing anything.
            2. Estimate size from tasks.md. Limit: 400 reviewable lines (tests, mocks, specs,
               lockfiles and generated code don't count). If it will clearly exceed that, open
               an issue "Split needed: <change-name>" proposing a split, then stop.
            3. Read the "Open questions" section of proposal.md. If any question is unanswered,
               do NOT guess: open an issue "Question: <change-name>" listing them, then stop.
            4. UI changes build from the design copy in design/ (you can't open Claude Design).
               If the screens listed in the change's design.md aren't in design/, open an issue
               "Question: <change-name>" saying the design must be snapshotted with /build, then stop.
               Create branch `autopilot/<change-name>` and implement tasks.md, following CLAUDE.md.
               If you need a new npm dependency, stop and open a "Question" issue instead.
            5. Run `npm run check` and `npm run test:e2e`. Fix failures. If still red after 3
               attempts, open the PR as a DRAFT and explain what is failing and why.
            6. Check size with `git diff --numstat origin/HEAD...HEAD`; over the limit means no
               PR — open the "Split needed" issue instead.
            7. Open a PR that fills in every section of .github/pull_request_template.md,
               including "Decisions I made without asking". Do NOT merge.
