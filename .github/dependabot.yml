# Weekly dependency updates, grouped so they arrive as a few PRs instead of dozens.
# Each PR runs the full CI gate; a human still reviews and merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint caps its TypeScript peer range; bump TS majors by hand
      # once typescript-eslint supports them, or `npm ci` fails with ERESOLVE.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
